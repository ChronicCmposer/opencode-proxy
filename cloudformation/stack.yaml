AWSTemplateFormatVersion: "2010-09-09"
Description: >
  opencode-proxy remote host: a single small arm64 EC2 instance (latest
  Amazon Linux 2023, resolved via SSM at launch) behind an Elastic IP,
  running the --remote half of the proxy as an OCI container under
  containerd — no Docker on the instance, just `ctr`. mTLS is the only
  access control (the security group leaves 443 open to the internet); SSH
  is restricted to AdminCidr. The container image is published as a
  GitHub Release asset (opencode-proxy.tar, built by `make image` — see
  README.md) and imported directly into containerd's content store.
  Certificates are pulled from SSM Parameter Store at boot rather than
  baked into the image or template, since CloudFormation cannot author
  SecureString parameters itself — see README.md for the upload step that
  must happen before this stack is deployed.

Parameters:
  InstanceType:
    Type: String
    Default: t4g.nano
    AllowedValues: [t4g.nano, t4g.micro, t3.micro, t3.small]
    Description: >
      t4g.nano (2 vCPU burstable, 0.5GB RAM, ~$3/mo) is the default: this
      host runs one static Go binary handling one home's tunnel and
      occasional phone requests, well under a nano's burst credits and RAM.
      containerd itself adds a modest fixed memory floor (~30-50MB) on top
      of the proxy process, still comfortably inside 0.5GB. Bump to
      t4g.micro (1GB) if you see OOM kills in `journalctl -u containerd` or
      plan to add more concurrent devices/streams than "a phone or two."
      t3.* variants exist only as an x86 fallback if arm64 capacity is ever
      unavailable in your region.
  KeyName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: EC2 key pair for emergency SSH access.
  AdminCidr:
    Type: String
    Description: CIDR allowed to SSH in (e.g. your home /32). Never 0.0.0.0/0.
    AllowedPattern: ^(\d{1,3}\.){3}\d{1,3}/\d{1,2}$
  DomainName:
    Type: String
    Description: The DNS name you will point at the stack's Elastic IP (informational; used only in tags/outputs).
  CertParamPrefix:
    Type: String
    Default: /opencode-proxy/server
    Description: >
      SSM Parameter Store path prefix holding the server cert material,
      uploaded by pki/issue-server.sh before this stack is deployed. Expects
      SecureString parameters at {prefix}/ca.crt, {prefix}/server.crt,
      {prefix}/server.key.
  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-arm64
    Description: >
      Resolved via SSM public parameter at every deploy/update, so the
      instance always launches on the latest AL2023 arm64 AMI rather than
      one pinned at template-authoring time.
  ImageTarURL:
    Type: String
    Default: https://github.com/ChronicCmposer/opencode-proxy/releases/latest/download/opencode-proxy.tar
    Description: >
      Where the instance fetches the --remote OCI image from. Produced by
      `make image` and published as a GitHub Release asset.
  ImageRef:
    Type: String
    Default: docker.io/library/opencode-proxy:latest
    Description: Image reference embedded in opencode-proxy.tar by `make image` — must match Makefile's IMAGE_NAME.
  RepoRef:
    Type: String
    Default: main
    Description: >
      Git tag/branch/commit the instance fetches a repo tarball from at
      boot (via codeload.github.com), to pull scripts/update-image.sh and
      the systemd/*.service|*.timer unit files. Those files in this repo
      are the single source of truth; the instance re-fetches them once
      here rather than embedding copies in this template, so updates to
      the updater or unit files don't require a stack redeploy.

Resources:
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ReadCertParams
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${CertParamPrefix}/*
              - Effect: Allow
                Action: kms:Decrypt
                Resource: !Sub arn:${AWS::Partition}:kms:${AWS::Region}:${AWS::AccountId}:alias/aws/ssm

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref InstanceRole]

  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: opencode-proxy remote host
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: Public HTTPS — mTLS is the real access control, not this rule.
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref AdminCidr
          Description: Emergency SSH from AdminCidr only.
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 0.0.0.0/0

  Instance:
    Type: AWS::EC2::Instance
    CreationPolicy:
      ResourceSignal:
        Timeout: PT5M
    Properties:
      InstanceType: !Ref InstanceType
      ImageId: !Ref LatestAmiId
      KeyName: !Ref KeyName
      IamInstanceProfile: !Ref InstanceProfile
      SecurityGroups: [!Ref SecurityGroup]
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs: { VolumeType: gp3, VolumeSize: 8, DeleteOnTermination: true }
      Tags:
        - { Key: Name, Value: !Sub "opencode-proxy-${DomainName}" }
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -eux
          trap '/opt/aws/bin/cfn-signal --exit-code $? --stack ${AWS::StackName} --resource Instance --region ${AWS::Region}' EXIT

          dnf install -y awscli containerd tar openssl || yum install -y awscli containerd tar openssl
          systemctl enable --now containerd

          mkdir -p /etc/opencode-proxy
          for f in ca.crt server.crt server.key; do
            aws ssm get-parameter --name "${CertParamPrefix}/$f" --with-decryption \
              --region ${AWS::Region} --query Parameter.Value --output text \
              > "/etc/opencode-proxy/$f"
          done
          chmod 600 /etc/opencode-proxy/server.key
          chmod 644 /etc/opencode-proxy/ca.crt /etc/opencode-proxy/server.crt

          # Certificate revocation list (--revoked). Created empty so the
          # service starts; add one hex serial per line to cut off a lost
          # device cert without rotating the whole CA, no redeploy needed.
          touch /etc/opencode-proxy/revoked.txt
          chmod 644 /etc/opencode-proxy/revoked.txt

          # Fetch this ref's systemd units, update script, and the release
          # signing public key as a tarball rather than embedding them in this
          # template, so updates to them don't require a stack redeploy. Done
          # before the image import so the signing key is in place to verify
          # it. Cleaned up at the end.
          curl -fsSL -o /tmp/opencode-proxy-src.tar.gz \
            "https://codeload.github.com/ChronicCmposer/opencode-proxy/tar.gz/${RepoRef}"
          mkdir -p /tmp/opencode-proxy-src
          tar -xzf /tmp/opencode-proxy-src.tar.gz -C /tmp/opencode-proxy-src --strip-components=1

          # Release signing public key: the image is verified against this
          # before it ever runs as root. See scripts/init-signing-key.sh.
          install -m 644 /tmp/opencode-proxy-src/scripts/release-signing.pub /etc/opencode-proxy/release-signing.pub

          # Verify the image signature at first boot too, not just on later
          # updates — a same-origin checksum proves integrity, not authenticity.
          curl -fsSL -o /tmp/opencode-proxy.tar "${ImageTarURL}"
          curl -fsSL -o /tmp/opencode-proxy.tar.sig "${ImageTarURL}.sig"
          openssl pkeyutl -verify -rawin -pubin -inkey /etc/opencode-proxy/release-signing.pub \
            -in /tmp/opencode-proxy.tar -sigfile /tmp/opencode-proxy.tar.sig
          ctr images import /tmp/opencode-proxy.tar
          sha256sum /tmp/opencode-proxy.tar | awk '{print $1}' > /etc/opencode-proxy/current.sha256
          rm -f /tmp/opencode-proxy.tar /tmp/opencode-proxy.tar.sig

          cat > /etc/opencode-proxy/remote.env <<ENV
          IMAGE_REF=${ImageRef}
          ENV

          # Shipped from the repo rather than written inline so the defaults
          # have one source of truth. Every key is optional — delete one and
          # the binary's built-in default applies.
          install -m 644 /tmp/opencode-proxy-src/config.example.json /etc/opencode-proxy/config.json

          install -m 644 /tmp/opencode-proxy-src/systemd/opencode-proxy.service /etc/systemd/system/opencode-proxy.service

          systemctl daemon-reload
          systemctl enable --now opencode-proxy

          install -m 755 /tmp/opencode-proxy-src/scripts/update-image.sh /usr/local/bin/opencode-proxy-update.sh

          cat > /etc/opencode-proxy/update.env <<ENV
          IMAGE_TAR_URL=${ImageTarURL}
          IMAGE_REF=${ImageRef}
          SERVICE_NAME=opencode-proxy
          STATE_DIR=/etc/opencode-proxy
          ENV

          install -m 644 /tmp/opencode-proxy-src/systemd/opencode-proxy-update.service /etc/systemd/system/opencode-proxy-update.service
          install -m 644 /tmp/opencode-proxy-src/systemd/opencode-proxy-update.timer /etc/systemd/system/opencode-proxy-update.timer

          rm -rf /tmp/opencode-proxy-src.tar.gz /tmp/opencode-proxy-src

          systemctl daemon-reload
          systemctl enable --now opencode-proxy-update.timer

  ElasticIP:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc

  EIPAssociation:
    Type: AWS::EC2::EIPAssociation
    Properties:
      InstanceId: !Ref Instance
      EIP: !Ref ElasticIP

Outputs:
  ElasticIP:
    Description: Point DomainName's A record at this IP.
    Value: !Ref ElasticIP
  InstanceId:
    Value: !Ref Instance
